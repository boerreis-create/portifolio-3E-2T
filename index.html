<!DOCTYPE html> <!--o DocType indica a linguagem de programação que está sendo usado-->
<html lang="pt-br"> <!--início do código-->
<head> <!--início do cabeçalho do documento. Dentro dessa tag pode ser inseridas folhas de estilo e scripts-->
    <meta charset="UTF-8"> <!--indica qual será os caracteres (character set ou charset) será utilizado para renderizar o texto da página-->
    <meta name="viewport" content="width=,initial-scale=1.0">
    <title>Document</title> <!--título do projeto-->
</head> <!--fim do cabeçalho do documento-->
<body> <!--nesse espaço está contido o conteúdo visual da página. As tags que representam texto, botões e outros devem ser adicionadas nesse intervalo-->
<!--um documento HTML é compostopor tags que são escritas entre < >. As tags precisam ser abertas e fechadas, o que as diferenciam é que tags de fechamento possuem um a \ antes do nome. Alguns códigos não precisam da <\> para fechamento, apenas da barra, como no caso da tag meta Outro aspecto importante da linguagem é que ela é case insensitive,ou seja, não leva em consideração a diferença entre letras oficiais e minúsculas.-->
<!--No HTML há seis níveis de cabeçalho/ títulos que podem ser usados por meios das tags h1,h2,h3,h4,h5.h6, sendo o h1 o maior e mais relevante e o h6 o menor/ menos relevante-->
 <h1>Portifólio</h1>
 <h2>Programação</h2>
 <h3>Html</h3>
 <h4>Css</h4>
 <h5>Js</h5>
 <h6>Matemática</h6>
 <!-- Parágrafos de texto são gerados em HTML por meio das tags <P> </P>. Esse é um exemplo de tag cuja disposição na tela se dá em forma de bloco, ou seja, um parágrafo é colocado sempre abaixo do outro.-->
 <p>Serve para colocar parágrafos no projeto, são os textos que aparecerão no site</p>
</body> <!--fechamento da tag-->
</html> <!--fim do código-->
